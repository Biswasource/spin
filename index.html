<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- SEO Meta Tags -->
    <title>SpinTech Design - Premium B2B Branding & Website Design Agency</title>
    <meta name="description" content="Leading B2B branding and website design agency in India. We craft digital ecosystems, SaaS solutions, and AI-powered websites that elevate your brand." />
    <meta name="keywords" content="branding agency, web design, B2B design, SaaS solutions, AI websites, digital design, India" />
    <meta name="author" content="SpinTech Design" />
    <meta name="robots" content="index, follow" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spintechdesign.com/" />
    <meta property="og:title" content="SpinTech Design - Premium B2B Branding & Website Design" />
    <meta property="og:description" content="We build digital products that matter. Specialized in B2B branding, SaaS solutions, and AI-powered websites." />
    <meta property="og:image" content="/logo.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://spintechdesign.com/" />
    <meta property="twitter:title" content="SpinTech Design - Premium B2B Branding & Website Design" />
    <meta property="twitter:description" content="We build digital products that matter. Specialized in B2B branding, SaaS solutions, and AI-powered websites." />
    <meta property="twitter:image" content="/logo.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Instrument Serif"', 'serif'],
              sans: ['"Inter"', 'sans-serif'],
            },
            colors: {
              beige: {
                50: '#FFFEF9',
                100: '#FFFBF2', // Main bg
                200: '#F5EFE0',
              },
              lime: {
                400: '#D4F23D', // Brand accent
                500: '#BFE020',
              },
              charcoal: '#1A1A1A',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FFFBF2;
        color: #1A1A1A;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      .font-serif-display {
        font-family: 'Instrument Serif', serif;
      }
      /* Custom selection color */
      ::selection {
        background-color: #D4F23D;
        color: #1A1A1A;
      }
      
      /* Hide scrollbar */
      ::-webkit-scrollbar {
        display: none;
      }
      html {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
